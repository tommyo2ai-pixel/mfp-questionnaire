<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Invite-only. This must never appear in search results. -->
		<meta name="robots" content="noindex, nofollow" />
		<title>Pre-Proposal Questionnaire — Ming Fong Paper Limited</title>
		<meta
			name="description"
			content="Pre-proposal questionnaire for the Flexographic Printing Standardization Program."
		/>

		<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

		<!-- Preloaded so the first paint is not a font swap on a slow connection. -->
		<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="assets/app.css" />
	</head>
	<body>
		<!-- Text carrying data-i18n is replaced by main.js on load and on every
		     language change. The English in the markup is the fallback if the
		     scripts never run. -->
		<a class="visually-hidden" href="#main" data-i18n="skipToContent">Skip to content</a>

		<header class="app-header">
			<div class="app-header-inner">
				<div class="brand">
					<img src="assets/logo.png" alt="" width="42" height="36" />
					<div>
						<div class="brand-name">Ming Fong Paper Limited</div>
						<div class="brand-sub" id="brand-sub">Pre-Proposal Questionnaire</div>
					</div>
				</div>
				<div class="header-right">
					<span class="save-pill" id="save-pill" data-state="saved" role="status" aria-live="polite" hidden>
						All answers saved
					</span>
					<!-- Filled by main.js. Deliberately not data-i18n: each button is
					     labelled in its own language, never in the current one. -->
					<div class="lang-toggle" id="lang-toggle" role="group"></div>
				</div>
			</div>
		</header>

		<main class="app-main" id="main">
			<!-- Every screen is rendered into here by main.js. -->
			<div id="app">
				<!-- No scripts means no translation either, so this one says both. -->
				<noscript>
					<div class="note note-warn note-standalone">
						<p>
							This questionnaire needs JavaScript so that your answers can be saved as you go.
							If you cannot enable it, email
							<a href="mailto:tommy.chan@mingfongpaper.com">tommy.chan@mingfongpaper.com</a>
							and we will send you a document version instead.
						</p>
						<p lang="zh-Hant">
							本問卷需要 JavaScript 才能在您填寫時儲存答案。若無法啟用，請來信
							<a href="mailto:tommy.chan@mingfongpaper.com">tommy.chan@mingfongpaper.com</a>，我們會改以文件形式寄送。
						</p>
					</div>
				</noscript>
			</div>
		</main>

		<!-- on-navy switches the focus ring to the brighter emerald; the darker
		     emerald used elsewhere is close to invisible on this bar. -->
		<footer class="app-footer on-navy">
			<div class="app-footer-inner">
				<span>Ming Fong Paper Limited · Hong Kong</span>
				<span>
					<a href="mailto:tommy.chan@mingfongpaper.com">tommy.chan@mingfongpaper.com</a>
				</span>
				<span data-i18n="confidential">All information is treated as confidential and used only for proposal preparation.</span>
			</div>
		</footer>

		<script type="module" src="js/main.js"></script>
	</body>
</html>
